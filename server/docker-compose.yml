services:
  postgres:
    image: postgres:18-alpine
    container_name: community-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1A2l3a4n
      POSTGRES_DB: community_maintenance
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d community_maintenance"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: community-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build: .
    container_name: community-server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:1A2l3a4n@postgres:5432/community_maintenance
      REDIS_URL: redis://redis:6379
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  client:
    build:
      context: ../client
      args:
        VITE_API_BASE_URL: http://localhost:5000/api
    container_name: community-client
    restart: unless-stopped
    ports:
      - "5173:4173"
    depends_on:
      server:
        condition: service_started

volumes:
  postgres_data: